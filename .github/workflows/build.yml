name: build

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # gradle.properties pins org.gradle.java.home to a local macOS path; drop it so the CI JDK is used.
      - name: Use the CI JDK
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Build
        run: ./gradlew build
